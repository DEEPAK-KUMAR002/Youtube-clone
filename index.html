<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virello</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-group">
        <button class="icon-button" id="menuButton" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" /></svg>
        </button>
        <a class="brand" href="#" aria-label="Virello home">
          <span class="brand-mark">
            <svg viewBox="0 0 36 26" aria-hidden="true"><path d="M32.4 3.9c-.4-1.5-1.6-2.7-3.1-3.1C26.5 0 18 0 18 0S9.5 0 6.7.8C5.2 1.2 4 2.4 3.6 3.9 2.8 6.7 2.8 13 2.8 13s0 6.3.8 9.1c.4 1.5 1.6 2.7 3.1 3.1 2.8.8 11.3.8 11.3.8s8.5 0 11.3-.8c1.5-.4 2.7-1.6 3.1-3.1.8-2.8.8-9.1.8-9.1s0-6.3-.8-9.1Z" /><path d="m15 18.5 8.1-5.5L15 7.5v11Z" /></svg>
          </span>
          <span>Virello</span>
        </a>
      </div>

      <form class="search" id="searchForm" role="search">
        <label class="sr-only" for="searchInput">Search</label>
        <input id="searchInput" type="search" placeholder="Search" autocomplete="off" />
        <button class="search-button" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.8-3.8" /></svg>
        </button>
      </form>

      <div class="actions">
        <button class="icon-button hide-small" aria-label="Create">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button class="icon-button hide-small" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M10 21h4" /></svg>
        </button>
        <button class="avatar-button" aria-label="Account">D</button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <nav aria-label="Main navigation">
          <a class="nav-item active" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" /></svg>
            <span>Home</span>
          </a>
          <a class="nav-item" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 8 6 4-6 4V8Z" /><rect x="3" y="5" width="18" height="14" rx="3" /></svg>
            <span>Shorts</span>
          </a>
          <a class="nav-item" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16" /><path d="M8 4h8v16H8z" /></svg>
            <span>Subscriptions</span>
          </a>
          <a class="nav-item" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14h14" /><path d="M8 9h8M8 13h5" /></svg>
            <span>Library</span>
          </a>
          <a class="nav-item" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2" /><circle cx="12" cy="12" r="9" /></svg>
            <span>History</span>
          </a>
        </nav>
      </aside>

      <main class="content">
        <section class="chips" aria-label="Categories" id="chips"></section>

        <section class="spotlight" aria-label="Featured video">
          <div class="spotlight-art">
            <div class="sun"></div>
            <div class="scope">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="spotlight-copy">
            <p class="eyebrow">Live now</p>
            <h1>Build Room: Designing a Creator Dashboard</h1>
            <p>Watch a clean, practical dashboard come together with reusable components, polished controls, and real product thinking.</p>
            <div class="spotlight-actions">
              <button class="primary-button" id="watchFeatured">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
                Watch
              </button>
              <button class="secondary-button">Save</button>
            </div>
          </div>
        </section>

        <div class="section-heading">
          <h2>Recommended</h2>
          <span id="resultCount"></span>
        </div>
        <section class="video-grid" id="videoGrid" aria-label="Recommended videos"></section>

        <div class="section-heading">
          <h2>Shorts</h2>
        </div>
        <section class="shorts-row" id="shortsRow" aria-label="Short videos"></section>
      </main>
    </div>

    <div class="player-modal" id="playerModal" aria-hidden="true">
      <div class="player-card" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
        <button class="icon-button close-player" id="closePlayer" aria-label="Close player">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <div class="player-screen" id="playerScreen">
          <div class="play-symbol">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
          </div>
        </div>
        <div class="player-meta">
          <h2 id="playerTitle">Video title</h2>
          <p id="playerChannel">Channel</p>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
