<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virello</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-group">
        <button class="icon-button" id="menuButton" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" /></svg>
        </button>
        <a class="brand" href="#" id="homeLink" aria-label="Virello home">
          <span class="brand-mark">
            <svg viewBox="0 0 36 26" aria-hidden="true"><path d="M32.4 3.9c-.4-1.5-1.6-2.7-3.1-3.1C26.5 0 18 0 18 0S9.5 0 6.7.8C5.2 1.2 4 2.4 3.6 3.9 2.8 6.7 2.8 13 2.8 13s0 6.3.8 9.1c.4 1.5 1.6 2.7 3.1 3.1 2.8.8 11.3.8 11.3.8s8.5 0 11.3-.8c1.5-.4 2.7-1.6 3.1-3.1.8-2.8.8-9.1.8-9.1s0-6.3-.8-9.1Z" /><path d="m15 18.5 8.1-5.5L15 7.5v11Z" /></svg>
          </span>
          <span>Virello</span>
        </a>
      </div>

      <form class="search" id="searchForm" role="search">
        <label class="sr-only" for="searchInput">Search</label>
        <input id="searchInput" type="search" placeholder="Search Virello" autocomplete="off" />
        <button class="search-button" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.8-3.8" /></svg>
        </button>
      </form>

      <div class="actions">
        <button class="icon-button hide-small" id="createButton" aria-label="Create">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button class="icon-button hide-small" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M10 21h4" /></svg>
        </button>
        <button class="avatar-button" aria-label="Account">D</button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <nav aria-label="Main navigation">
          <a class="nav-item active" href="#" data-nav="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" /></svg>
            <span>Home</span>
          </a>
          <a class="nav-item" href="#shorts" data-nav="shorts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 8 6 4-6 4V8Z" /><rect x="3" y="5" width="18" height="14" rx="3" /></svg>
            <span>Shorts</span>
          </a>
          <a class="nav-item" href="#" data-nav="subscriptions">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16" /><path d="M8 4h8v16H8z" /></svg>
            <span>Subscriptions</span>
          </a>
          <a class="nav-item" href="#" data-nav="library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14h14" /><path d="M8 9h8M8 13h5" /></svg>
            <span>Library</span>
          </a>
          <a class="nav-item" href="#" data-nav="history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2" /><circle cx="12" cy="12" r="9" /></svg>
            <span>History</span>
          </a>
        </nav>
      </aside>

      <main class="content">
        <section class="home-view" id="homeView">
          <section class="chips" aria-label="Categories" id="chips"></section>

          <section class="spotlight" aria-label="Featured video">
            <button class="spotlight-media" id="watchFeatured" type="button" aria-label="Play featured video">
              <img id="featuredThumb" alt="" />
              <span class="spotlight-play">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
              </span>
            </button>
            <div class="spotlight-copy">
              <p class="eyebrow">Now playing</p>
              <h1 id="featuredTitle">Virello Player</h1>
              <p id="featuredDescription">A real playable video experience powered by YouTube embeds.</p>
              <div class="spotlight-actions">
                <button class="primary-button" id="watchFeaturedAction" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
                  Watch
                </button>
                <button class="secondary-button" id="copyLinkButton" type="button">Copy link</button>
              </div>
            </div>
          </section>

          <div class="section-heading">
            <h2>Recommended</h2>
            <span id="resultCount"></span>
          </div>
          <section class="video-grid" id="videoGrid" aria-label="Recommended videos"></section>

          <div class="section-heading" id="shorts">
            <h2>Shorts</h2>
          </div>
          <section class="shorts-row" id="shortsRow" aria-label="Short videos"></section>
        </section>

        <section class="watch-view" id="watchView" hidden>
          <div class="watch-layout">
            <div class="watch-main">
              <div class="player-frame">
                <div id="youtubePlayer"></div>
              </div>
              <h1 class="watch-title" id="watchTitle"></h1>
              <div class="watch-meta-row">
                <div class="watch-channel">
                  <span class="channel-avatar" id="watchAvatar">V</span>
                  <div>
                    <strong id="watchChannel"></strong>
                    <p id="watchSubscribers"></p>
                  </div>
                </div>
                <div class="watch-actions">
                  <button class="pill-button" id="likeButton" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v10H4V11h3Z" /><path d="M7 11 12 2c1.1.4 1.8 1.6 1.5 2.8L12.7 8H18a3 3 0 0 1 2.9 3.7l-1.5 6A3 3 0 0 1 16.5 20H7" /></svg>
                    <span id="likeCount">0</span>
                  </button>
                  <button class="pill-button" id="shareButton" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7" /><path d="M12 3v13M7 8l5-5 5 5" /></svg>
                    Share
                  </button>
                </div>
              </div>
              <div class="description-box">
                <strong id="watchViews"></strong>
                <p id="watchDescription"></p>
              </div>
              <section class="comments-panel" aria-label="Comments">
                <h2 id="commentCount">0 comments</h2>
                <form class="comment-form" id="commentForm">
                  <input id="commentName" type="text" placeholder="Your name" maxlength="32" />
                  <input id="commentText" type="text" placeholder="Add a comment" maxlength="280" required />
                  <button class="primary-dark-button" type="submit">Post</button>
                </form>
                <div class="comments-list" id="commentsList"></div>
              </section>
            </div>
            <aside class="watch-sidebar" aria-label="Recommended videos" id="watchRecommendations"></aside>
          </div>
        </section>
      </main>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
  </body>
</html>
